<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>식단표</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 10px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 2.4em; color: #1a252f; border-bottom: 5px solid #2c3e50; padding-bottom: 20px; }
        
        .setup-box { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin: 10px 0; padding: 30px; background: #f8f9fa; border-radius: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 1.5em; font-weight: bold; color: #555; }
        input { padding: 5px; border: 1px solid #ddd; border-radius: 12px; font-size: 22px; width: 100px; }
        button { padding: 15px 40px; background: #2c3e50; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.3s; }
		Sbutton { padding: 15px 30px; background: #2c3e50; color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 22px; transition: 0.3s; }
        button:hover { background: #1abc9c; transform: translateY(-2px); }

        .budget-summary { background: #1a252f; color: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; font-size: 1.9em; }
        .budget-summary span { color: #1abc9c; font-weight: bold; }
        .over-budget { color: #e74c3c !important; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 15px; }
        .card { border: 1px solid #eee; border-radius: 20px; padding: 25px; background: #fff; transition: 0.3s; position: relative; }
        .card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .day-label { font-weight: bold; color: #bdc3c7; font-size: 1.4em; margin-bottom: 15px; display: block; }
        
        .meal { margin-bottom: 18px; padding: 15px; border-radius: 12px; background: #fafafa; border-left: 6px solid #dcdde1; }
        .meal.B { border-left-color: #3498db; } 
        .meal.S { border-left-color: #2ecc71; }
        .meal.P { border-left-color: #f1c40f; background: #fffdf0; }
        
        .meal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .meal-name { font-weight: bold; font-size: 2.0em; color: #2c3e50; text-decoration: none; }
		.recipe-links { font-size: 1.5em; display: flex; gap: 5px; margin-top: 4px; }
        .recipe-links a { color: #7f8c8d; text-decoration: none; border: 1px solid #ddd; padding: 2px 5px; border-radius: 4px; }
        .recipe-links a:hover { background: #eee; }
        
        
        .meal-price { font-size: 2.0em; 
			  color: #e74c3c; 
			  font-weight: bold;

			  /* 2. 들쭉날쭉함과 줄바꿈을 원천 봉쇄하는 절대 방어 군령 */
			  white-space: nowrap !important;  /* 가격 텍스트가 어떤 압박을 받아도 절대 아랫줄로 떨어지지 않게 고정 */
			  word-break: keep-all !important; /* 금액 단위가 지저분하게 쪼개지는 현상 방지 */
			  
			  /* 3. 공간 확보 및 정렬 최적화 */
			  display: inline-block;
			  text-align: right;               /* 우측 정렬로 시각적 안정감 부여 */
			  margin-left: auto;               /* flex 부모 환경일 경우, 메뉴명을 좌측으로 밀고 자신은 우측 끝에 밀착 */
			  
			  /* 4. 최소 가로폭 저지선 구축 */
			  min-width: 120px;}
        
        .ing-list { margin-top: 12px; border-top: 1px dashed #eee; padding-top: 10px; }
        .ing-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 1.8em; }
        .shop-links a { font-size: 1.2em; text-decoration: none; margin-left: 8px; font-weight: bold; }
        .cp { color: #e67e22; } /* 쿠팡: 주황 */
        .nv { color: #27ae60; } /* 네이버: 초록 */
		
		
		/* 전체 버튼을 하나로 묶어 들쭉날쭉함을 잡고, 따뜻한 여백을 주는 컨테이너 */
		.recipe-warm-container {
		  display: flex;
		  align-items: right;
		  max-width: 480px; /* 주공의 본문 레이아웃에 맞춰 자연스럽게 녹아듭니다 */
		  gap: 6px;         /* 버튼 사이의 단정한 간격 */
		  margin: 2px 0;
		  padding: 6px;
		  background-color: #faf7f2; /* 밝고 따뜻한 오프화이트 크림 베이지 바탕 */
		  border-radius: 10px;       /* 전체 진형을 둥글고 부드럽게 감싸안음 */
		  box-sizing: border-box;
		}

		/* 메뉴명이 길어져도 1:1:1:1 비율을 칼같이 유지하는 따뜻한 감성 버튼 */
		.warm-btn {
		  display: inline-flex;
		  align-items: right;
		  justify-content: right;
		  padding: 10px 2px;
		  font-size: 18px;
		  font-weight: 700;
		  text-align: right;
		  text-decoration: none;
		  
		  /* 밝고 부드러운 웜톤 컬러 매칭 */
		  background-color: #ffffff; /* 순백의 깔끔한 버튼 베이스 */
		  color: #ff6b35;            /* 식욕을 돋우는 부드러운 오렌지 웜톤 텍스트 */
		  border: 1px solid #f0e6d6;  /* 은은한 토스트 빛깔의 테두리 */
		  border-radius: 6px;
		  
		  box-sizing: border-box;
		  white-space: normal;       /* 메뉴명이 길면 버튼 안에서 얌전히 줄바꿈 */
		  word-break: keep-all;      /* 단어가 어색하게 쪼개지는 현상 방지 */
		  transition: all 0.2s ease-in-out;
		}

		/* 유저가 마우스를 올리거나 터치했을 때의 화사한 반응 */
		.warm-btn:hover {
		  background-color: #ff6b35; /* 활성화 시 따뜻한 주홍빛으로 전면 물듦 */
		  color: #ffffff;            /* 글자는 백색으로 반전 */
		  border-color: #ff6b35;
		  /* 부드러운 오렌지빛 노을 같은 잔상 효과 */
		  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2); 
		  transform: translateY(-1px);
		}

		/* 버튼을 누르는 순간의 가벼운 타격감 */
		.warm-btn:active {
		  transform: translateY(0);
		  box-shadow: 0 2px 4px rgba(255, 107, 53, 0.1);
		}

</head>

function executeLogistics() {
    const targetBudget = parseInt(document.getElementById('budgetInput').value);
    const peopleCount = parseInt(document.getElementById('peopleInput').value);
	const budgetOption = document.getElementById('budgetOption').value;
    const cuisineOption = document.getElementById('cuisineOption').value;
    const correctionFactor = peopleCount / 2;
	
	// [전략 설정] 옵션별 가중치 데이터
    const STRATEGY = {
        premium: { margin: 1.0, topRange: 20 },  // 예산 꽉 채우기, 더 좁은 범위(더 비싼 것 위주)
        normal:  { margin: 0.8, topRange: 100 }, // 예산 90%, 상위 100개 랜덤
        economy: {margin: 0.6, topRange: 300 }  // 예산 70%만 사용, 더 넓은 범위(저렴한 것 섞임)
    };
    
    const currentStrategy = STRATEGY[budgetOption];
    
    let currentTotal = 0;
    let plan = [];
    // [비책] 이미 선택된 메뉴의 이름을 기록하여 중복을 차단할 저장소
    let usedMenuNames = new Set();
	
    for (let day = 1; day <= 30; day++) {
        const remainingDays = 31 - day;
        // 1. 오늘 사용할 수 있는 최대 금전의 한계를 설정
        let dailyLimit = (targetBudget*currentStrategy.margin - currentTotal) / remainingDays;
        // 2. [핵심] 가격 필터링이 탑재된 새로운 추출 함수
        const getAffordableMeal = (list, limit, mealType) => {
            // 인원 보정가가 적용된 가격이 limit 이하인 것만 선별
            //const affordable = list.filter(item => Math.round(item.p * correctionFactor) <= limit);

    const selectedCuisine = (cuisineOption || 'all').toLowerCase().trim();
		
		// 2. 조건에 맞는 메뉴 필터링 (보정가 계산 포함)
let affordable = list.filter(item => {
    // [교정 1] 가격 계산을 먼저 수행하되, 루프 밖에서 정의된 변수들을 활용하소서.
    const finalPrice = Math.round(item.p * correctionFactor);
    
    // [교정 2] 선택된 나라 옵션 정제 (필터 루프 밖에서 처리하는 것이 더 효율적이나 일단 유지하옵니다)
    const itemCuisine = (item.c || "").toLowerCase().trim();
    
    // [교정 3] 하한선 설정
    let minPriceLimit = 0;
    if (budgetOption !== 'economy') {
	 if (mealType === 'P'){
		minPriceLimit = 4500;
		} else if (mealType === 'S') {
		minPriceLimit = 6000;
		} else { 
		minPriceLimit=0;
		}
    }

	

    // [검증] 실제 필터 통과 여부를 결정하는 4대 요소
    const isPriceUnderLimit = finalPrice <= limit;
    const isPriceOverMin = finalPrice >= minPriceLimit;
    const isNotUsed = !usedMenuNames.has(item.n);
    const isCuisineMatch = (selectedCuisine === 'all' || itemCuisine === selectedCuisine);
	
		<!-- const isOk= isPriceUnderLimit && isPriceOverMin && isNotUsed && isCuisineMatch; -->
		<!-- console.log(`: ${item.n} 최소 값${minPriceLimit} OK: ${isOk} `); -->

    return isPriceUnderLimit && isPriceOverMin && isNotUsed && isCuisineMatch;
});

			
			let selected;
            // 만약 가용 메뉴가 없다면, 리스트에서 가장 저렴한 메뉴를 강제 선택
            if (affordable.length > 0) {
             // [주군의 명] 예산 내 메뉴들을 가격 내림차순(비싼 순)으로 정렬
        const sortedAffordable = [...affordable].sort((a, b) => b.p - a.p);

        // 상위 100개(혹은 가용한 전체 개수)를 추출
        const top100 = sortedAffordable.slice(0, sortedAffordable.length>currentStrategy.topRange?currentStrategy.topRange:sortedAffordable.length);

        // 그 100개 중에서 하나를 무작위로 추첨
        selected = top100[Math.floor(Math.random() * top100.length)];
				
				//selected = [...affordable].sort((a, b) => b.p - a.p)[0];
				// 2. [핵심 수정] 가용 메뉴 중 가격(p)이 가장 높은 순으로 정렬 후 랜덤 추출
              // 내림차순 정렬: b.p - a.p
              //selected = affordable.sort((a, b) => b.p - a.p)[Math.floor(Math.random() * affordable.length)];
            } else {
			
		
			
			let nonUsedOnly = list.filter(item => !usedMenuNames.has(item.n) && (selectedCuisine === 'all' || (item.c && item.c.toLowerCase().trim() === selectedCuisine)));
                selected = nonUsedOnly.length > 0 
                    ? nonUsedOnly.reduce((min, p) => p.p < min.p ? p : min)
                    : list[0]; // 그마저 없으면 완전 중복 허용
					
               // selected = list.reduce((min, p) => p.p < min.p ? p : min, list[0]);
            }
			
			// 선택된 메뉴 이름을 기록하여 다음 날부터 제외함
            usedMenuNames.add(selected.n);
			
            return { ...selected, p: Math.round(selected.p * correctionFactor) };
        };

        // 3. 아침/점심/저녁 순차적 예산 집행 (남은 돈은 다음 끼니로 이월)
        // 아침은 일일 예산의 20% 이내에서 권장
        let b = getAffordableMeal(DATA.B, dailyLimit * 0.3*currentStrategy.margin, 'B'); 
        
        // 점심은 (일일예산 - 아침값)의 40% 이내에서 권장
        let s = getAffordableMeal(DATA.S, (dailyLimit - b.p) * 0.5*currentStrategy.margin, 'P'); 
        
        // 저녁은 남은 모든 일일 예산을 쏟아부음
        let p = getAffordableMeal(DATA.P, dailyLimit - (b.p + s.p), 'S');
		
	
       let dailyKcal = b.k + s.k + p.k;

        plan.push({ day, meals: [ {t:'B', d:b, l:'아침'}, {t:'S', d:s, l:'점심'}, {t:'P', d:p, l:'저녁'} ], totalKcal: dailyKcal});
        currentTotal += (b.p + s.p + p.p);
    }

    const summaryDiv = document.getElementById('budgetSummary');
    const isOver = currentTotal > targetBudget;
    summaryDiv.innerHTML = `
        <div class="budget-summary">
            예산: ${targetBudget.toLocaleString()}원 | 
            총액: <span class="${isOver ? 'over-budget' : ''}">${currentTotal.toLocaleString()}원</span> | 
            인원: ${peopleCount}인
        </div>`;

    const display = document.getElementById('display');
    display.innerHTML = "";

    plan.forEach(day => {
        const card = document.createElement('div');
        card.className = 'card';
        let html = `<span class="day-label">DAY ${day.day} <small style="float:right">총 ${day.totalKcal} kcal(1인기준)</small></span>`;
        
        day.meals.forEach(m => {
            let ingHtml = m.d.i.map(ing => `
                <div class="ing-item">
                    <span>${ing}</span>
                    <div class="shop-links">
						<a href="https://link.coupang.com/re/AFFSRP?lptag=AF7838662&pageKey=${encodeURIComponent(ing)}&traceid=V0-153-${Math.random().toString(36).substring(2, 15)}" target="_blank" class="cp">쿠팡</a>
                        <a href="https://search.shopping.naver.com/search/all?query=${encodeURIComponent(ing)}" target="_blank" class="nv">네이버</a>
                    </div>
                </div>`).join('');

            html += `
                <div class="meal ${m.t}">
                    <div class="meal-header">
                        <div>
                            <div class="meal-name">${m.d.n}</div>
							<div style="font-size: 1.2em; color: #7f8c8d; margin-top: 2px;">
							🔥 ${m.d.k} kcal</div>
							<div class="recipe-flex-master">
								<div class="recipe-links">
									<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.d.n + ' 레시피')}" target="_blank">YouTube</a>
									<a href="https://www.google.com/search?q=${encodeURIComponent(m.d.n)}" target="_blank">Google</a>
									<a href="https://www.10000recipe.com/recipe/list.html?q=${encodeURIComponent(m.d.n)}" target="_blank">만개의레시피</a>
								</div>
							</div>
                        </div>
						
						
						 
						<div class="recipe-warm-container">						  
						  <a href="https://link.coupang.com/re/AFFSRP?lptag=AF7838662&pageKey=${encodeURIComponent(m.d.n)}&traceid=V0-153-${Math.random().toString(36).substring(2, 15)}" target="_blank" class="warm-btn">쿠팡</a>
						  <a href="https://www.google.com/search?q=${encodeURIComponent(m.d.n)}&tbm=shop" target="_blank" class="warm-btn">Google</a>
						  <a href="https://map.naver.com/v5/search/${encodeURIComponent(m.d.n)}" target="_blank" class="warm-btn">네이버맵</a>
						  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.d.n)}" target="_blank" class="warm-btn">구글맵</a>
						</div>

                        <span class="meal-price">${m.d.p.toLocaleString()}원</span>
                    </div>
                    <div class="ing-list">${ingHtml}</div>
                </div>`;
				
        });
		
        card.innerHTML = html;
        display.appendChild(card);
    });
}

	function saveAsInteractiveHTML() {
    const style = document.querySelector('style').innerHTML;
    const content = document.getElementById('foodGrid').innerHTML;
    const now = new Date();
    const fileName = `식단표_${now.getFullYear()}${now.getMonth()+1}${now.getDate()}_${now.getHours()}${now.getMinutes()}.html`;
    const fullHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${style}</style></head><body><div class="container">${content}</div></body></html>`;

    // 안드로이드 앱인지 확인 (비밀 통로가 열려 있는지)
    if (window.AndroidApp && window.AndroidApp.downloadBlob) {
        // HTML 내용을 Base64로 변환하여 앱으로 전송
        const reader = new FileReader();
        const blob = new Blob([fullHTML], { type: 'text/html' });
        reader.readAsDataURL(blob);
        reader.onloadend = function() {
            const base64data = reader.result.split(',')[1];
            window.AndroidApp.downloadBlob(base64data, fileName, 'text/html');
        }
    } else {
        // 일반 브라우저용 기존 코드
        const blob = new Blob([fullHTML], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(link.href);
    }
}

    // 페이지 로드 시 즉시 실행
    window.onload = executeLogistics;
</script>
